# Disparo da semente diária pelo WhatsApp.
#
# O agendador é de propósito burro: só chama uma URL. Toda a decisão — quem
# recebe, qual semente, se já recebeu hoje — fica no backend, onde dá para
# testar. Foi o mesmo motivo de dispensar o n8n, sem a mensalidade.
#
# Antes de funcionar, cadastre em Settings → Secrets and variables → Actions:
#   GRAO_API_TOKEN  — o mesmo valor que está no Render
#   GRAO_API_URL    — https://grao-backend.onrender.com

name: Semente diária

on:
  schedule:
    # O GitHub agenda em UTC. Brasília é UTC-3, então somamos 3 horas.
    - cron: '0 10 * * *'   #  7h em Brasília → janela dawn
    - cron: '0 12 * * *'   #  9h            → morning
    - cron: '0 15 * * *'   # 12h            → noon
    - cron: '0 23 * * *'   # 20h            → evening
  workflow_dispatch:
    inputs:
      window:
        description: 'Janela a disparar manualmente'
        required: true
        default: morning
        type: choice
        options: [dawn, morning, noon, evening]

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Descobrir a janela
        id: janela
        run: |
          if [ -n "${{ inputs.window }}" ]; then
            echo "w=${{ inputs.window }}" >> "$GITHUB_OUTPUT"
          else
            # Hora de Brasília no momento do disparo
            H=$(TZ=America/Sao_Paulo date +%H)
            if   [ "$H" -lt 8 ];  then W=dawn
            elif [ "$H" -lt 11 ]; then W=morning
            elif [ "$H" -lt 15 ]; then W=noon
            else                       W=evening
            fi
            echo "w=$W" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar
        env:
          URL: ${{ secrets.GRAO_API_URL }}
          TOKEN: ${{ secrets.GRAO_API_TOKEN }}
          W: ${{ steps.janela.outputs.w }}
        run: |
          echo "Janela: $W"
          # --fail-with-body faz o passo quebrar em erro HTTP mas ainda mostrar
          # a resposta; sem isso uma falha de disparo passaria como sucesso.
          curl -sS --fail-with-body -X POST \
            --max-time 600 \
            -H "x-grao-token: $TOKEN" \
            "$URL/whatsapp/dispatch?window=$W"
