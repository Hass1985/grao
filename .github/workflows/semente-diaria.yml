# Batimento de reserva da entrega diária.
#
# A entrega de verdade acontece DENTRO do backend (server/src/agenda.ts), que
# varre de minuto em minuto e respeita o horário escolhido por cada pessoa.
# Este workflow existe só para o caso de o processo estar fora do ar: chama a
# mesma varredura de hora em hora, e ela é idempotente — quem já recebeu hoje
# não recebe de novo.
#
# Por que não é ele quem entrega: o agendador do GitHub atrasa. Já vimos
# execuções saindo duas horas depois do horário marcado, o que era tolerável
# para janelas de 4 horas e é inaceitável para quem pediu 6h45.
#
# Cadastre em Settings → Secrets and variables → Actions:
#   GRAO_API_TOKEN  — o mesmo valor que está no Render
#   GRAO_API_URL    — https://grao-backend.onrender.com

name: Semente diária (reserva)

on:
  schedule:
    - cron: '7 * * * *'   # de hora em hora, no minuto 7
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Varrer quem está na hora
        env:
          URL: ${{ secrets.GRAO_API_URL }}
          TOKEN: ${{ secrets.GRAO_API_TOKEN }}
        run: |
          # --fail-with-body faz o passo quebrar em erro HTTP mas ainda mostrar
          # a resposta; sem isso uma falha de disparo passaria como sucesso.
          curl -sS --fail-with-body -X POST \
            --max-time 600 \
            -H "x-grao-token: $TOKEN" \
            "$URL/whatsapp/dispatch"
