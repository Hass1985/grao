<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel do Grão</title>
<style>
/* ===========================================================================
   Painel do Grão — uma página, oito seções, um único fetch.
   A navegação é por hash (#pessoas), então recarregar mantém onde você estava.
   =========================================================================== */
:root{
  --papel:#F4F0E8; --carta:#FFFFFF; --fundo-fraco:#FAF7F1;
  --tinta:#1C1813; --tinta-media:#6B6154; --tinta-fraca:#9C9081;
  --linha:#E7DFD1; --linha-fraca:#F0EAE0;
  --acento:#B4762A; --acento-claro:#F6EBD9; --acento-escuro:#8E5B1D;
  --verde:#4E7A52; --verde-claro:#E6EFE6;
  --alerta:#A8542B; --alerta-claro:#F8E9E1;
  --teal:#3E6B6B; --barro:#9B5F3E;
  --lateral:#1E1913; --lateral-tinta:#CFC5B4; --lateral-ativo:#2E271D;
  --sombra:0 1px 2px rgba(28,24,19,.04), 0 8px 24px -18px rgba(28,24,19,.35);
  --raio:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--papel);color:var(--tinta);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
.oculto{display:none !important}

/* ---------- porta de entrada ---------- */
#porta{max-width:360px;margin:0 auto;padding:16vh 24px;text-align:center}
#porta .marca-grande{display:flex;justify-content:center;margin-bottom:20px}
#porta h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
#porta p{color:var(--tinta-media);font-size:14px;margin:0 0 20px}
#porta input{width:100%;padding:11px 14px;font:inherit;border:1px solid var(--linha);
  border-radius:8px;background:var(--carta);margin-bottom:10px}
#porta input:focus{outline:2px solid var(--acento);outline-offset:1px;border-color:transparent}
#erro{color:var(--alerta);font-size:13px;min-height:20px;margin-top:12px}

/* ---------- esqueleto ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

/* ---------- lateral ---------- */
.lateral{
  background:var(--lateral);color:var(--lateral-tinta);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.marca{display:flex;align-items:center;gap:10px;padding:22px 20px 18px}
.marca .nome{color:#F2ECE1;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1}
.marca .sub{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:#8B8071;font-weight:600;margin-top:4px}
.lateral nav{padding:6px 12px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.lateral a{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;
  color:var(--lateral-tinta);text-decoration:none;font-size:14px;line-height:1.2;
  transition:background .12s,color .12s;
}
.lateral a svg{flex:none;opacity:.72}
.lateral a:hover{background:#26201A;color:#F2ECE1}
/* O item ativo precisa se distinguir do hover: só a diferença de fundo entre
   #26201A e #2E271D é imperceptível, e a pessoa perde de vista onde está. */
.lateral a.ativo{background:var(--lateral-ativo);color:#FFF;font-weight:500;position:relative}
.lateral a.ativo::before{content:"";position:absolute;left:0;top:7px;bottom:7px;
  width:3px;border-radius:0 3px 3px 0;background:var(--acento)}
.lateral a.ativo svg{opacity:1;color:var(--acento)}
.lateral a .pino{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;
  background:var(--alerta);color:#fff;font-variant-numeric:tabular-nums}
.rodape-lateral{margin-top:auto;padding:14px 20px 18px;border-top:1px solid #2C251B;
  font-size:11px;color:#7C7263;display:flex;flex-direction:column;gap:8px}
.rodape-lateral button{background:none;border:1px solid #38301F;color:#9C9081;
  border-radius:6px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer;align-self:flex-start}
.rodape-lateral button:hover{color:#E8E0D2;border-color:#584B33}

/* ---------- topo ---------- */
main{min-width:0;display:flex;flex-direction:column}
/* Grade em vez de flex: com flex-wrap, uma descrição mais longa empurrava os
   controles para a linha de baixo, e o cabeçalho mudava de altura a cada
   seção. Aqui título e ações ficam sempre lado a lado, e a descrição ocupa a
   linha inteira embaixo. */
.topo{
  position:sticky;top:0;z-index:5;background:rgba(244,240,232,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--linha);
  padding:20px 32px;display:grid;grid-template-columns:1fr auto;
  align-items:center;column-gap:20px;row-gap:4px;
}
.topo h1{font-size:22px;margin:0;letter-spacing:-.02em;line-height:1.2;min-width:0}
.topo .desc{color:var(--tinta-media);font-size:13px;margin:0;grid-column:1/-1;max-width:78ch}
.acoes{display:flex;align-items:center;gap:8px}
select,.botao{
  font:inherit;font-size:13px;background:var(--carta);color:var(--tinta);
  border:1px solid var(--linha);border-radius:7px;padding:7px 10px;cursor:pointer;
}
select:hover,.botao:hover{border-color:var(--tinta-fraca)}
.botao.forte{background:var(--acento);border-color:var(--acento);color:#fff}
.botao.forte:hover{background:var(--acento-escuro);border-color:var(--acento-escuro)}
.carimbo{font-size:11px;color:var(--tinta-fraca);white-space:nowrap}
.conteudo{padding:26px 32px 72px;flex:1}

/* ---------- blocos ---------- */
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}
  .g3,.g2,.g-2-1{grid-template-columns:1fr}}

.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:var(--raio);
  padding:18px 20px;box-shadow:var(--sombra)}
.cartao h3{font-size:13px;font-weight:600;margin:0 0 2px;letter-spacing:-.005em}
.cartao .nota{font-size:12px;color:var(--tinta-fraca);margin:0 0 14px}
.cartao h3+.tabela,.cartao h3+.lista,.cartao h3+svg{margin-top:14px}

.kpi .rotulo{font-size:12px;color:var(--tinta-media);margin:0 0 6px}
.kpi .valor{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.kpi .apoio{font-size:12px;color:var(--tinta-fraca);margin:6px 0 0}
.kpi .apoio b{color:var(--tinta-media);font-weight:500}

.secao-titulo{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-fraca);margin:30px 0 12px}
.secao-titulo:first-child{margin-top:0}

/* ---------- listas com barra ---------- */
.lista{display:flex;flex-direction:column;gap:11px}
.item .cima{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:5px}
.item .rot{font-size:13px}
.item .val{font-size:13px;color:var(--tinta-media);font-variant-numeric:tabular-nums;flex:none}
.trilho{height:7px;background:var(--linha-fraca);border-radius:99px;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--acento);border-radius:99px}
.trilho i.verde{background:var(--verde)}

/* ---------- funil ---------- */
.degrau{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--linha-fraca)}
.degrau:last-child{border-bottom:0}
.degrau .ordem{width:22px;height:22px;border-radius:99px;background:var(--acento-claro);
  color:var(--acento-escuro);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.degrau .corpo{flex:1;min-width:0}
.degrau .rot{font-size:13px;margin-bottom:5px;display:flex;justify-content:space-between;gap:10px}
.degrau .queda{color:var(--alerta);font-size:11px;font-weight:500;white-space:nowrap}
.degrau .direita{text-align:right;flex:none;width:74px}
.degrau .n{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.degrau .pct{font-size:11px;color:var(--tinta-fraca)}

/* ---------- tabelas ---------- */
.rolagem{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tinta-fraca);font-weight:600;padding:0 12px 9px 0;white-space:nowrap}
td{padding:9px 12px 9px 0;border-top:1px solid var(--linha-fraca);vertical-align:top}
tbody tr:hover{background:var(--fundo-fraco)}
td.dir,th.dir{text-align:right;padding-right:0}
.mono{font-variant-numeric:tabular-nums}
.fraco{color:var(--tinta-fraca)}
.forte{font-weight:500}

.selo{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
  background:var(--acento-claro);color:var(--acento-escuro);white-space:nowrap}
.selo.ok{background:var(--verde-claro);color:var(--verde)}
.selo.ruim{background:var(--alerta-claro);color:var(--alerta)}
.selo.neutro{background:var(--linha-fraca);color:var(--tinta-media)}

/* ---------- avisos ---------- */
.aviso{display:flex;gap:12px;border:1px solid var(--linha);border-left:3px solid var(--acento);
  background:var(--carta);border-radius:0 var(--raio) var(--raio) 0;padding:13px 16px;font-size:13px}
.aviso.grave{border-left-color:var(--alerta)}
.aviso b{display:block;margin-bottom:2px}
.aviso p{margin:0;color:var(--tinta-media)}

/* ---------- gráficos ---------- */
svg.gr{width:100%;height:auto;display:block;overflow:visible}
.legenda{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--tinta-media);margin-top:12px}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{width:9px;height:9px;border-radius:2px;display:inline-block}

.vazio{color:var(--tinta-fraca);font-size:13px;padding:6px 0;margin:0}

/* ---------- busca ---------- */
.busca{width:100%;max-width:280px;padding:7px 11px;font:inherit;font-size:13px;
  border:1px solid var(--linha);border-radius:7px;background:var(--carta)}

/* ---------- linha do tempo ---------- */
.tempo{display:flex;flex-direction:column}
.tempo .ev{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--linha-fraca);font-size:13px}
.tempo .ev:last-child{border-bottom:0}
.tempo .hora{color:var(--tinta-fraca);font-size:12px;width:88px;flex:none;font-variant-numeric:tabular-nums}
.tempo .quem{font-weight:500;width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tempo .oque{color:var(--tinta-media);min-width:0}
.tempo .ev.falha .oque{color:var(--alerta)}

@media(max-width:860px){
  /* O cabeçalho em duas colunas tem largura mínima própria (título + relógio +
     seletor + botão). Abaixo de ~430px isso estoura a tela e a página inteira
     ganha rolagem horizontal. Empilhado, não estoura. */
  .topo{grid-template-columns:1fr}
  .acoes{flex-wrap:wrap}
  .app{grid-template-columns:1fr}
  .lateral{position:static;height:auto}
  .lateral nav{flex-direction:row;overflow-x:auto;padding:0 12px 12px}
  .lateral a{white-space:nowrap}
  .lateral a .pino{margin-left:6px}
  .rodape-lateral{flex-direction:row;align-items:center;justify-content:space-between}
  .topo,.conteudo{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>

<!-- ====================== porta de entrada ====================== -->
<div id="porta">
  <div class="marca-grande">
    <svg width="46" height="46" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <ellipse cx="13" cy="13" rx="14.95" ry="9.75" stroke="#B4762A" stroke-width="1.5"/>
      <line x1="13" y1="3.25" x2="13" y2="22.75" stroke="#B4762A" stroke-width="1.5"/>
    </svg>
  </div>
  <h1>Painel do Grão</h1>
  <p>Cole o token de acesso.</p>
  <input id="token" type="password" placeholder="token" autocomplete="off">
  <button class="botao forte" style="width:100%;padding:11px" onclick="entrar()">Entrar</button>
  <p id="erro"></p>
</div>

<!-- ====================== painel ====================== -->
<div class="app oculto" id="app">
  <aside class="lateral">
    <div class="marca">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <ellipse cx="13" cy="13" rx="14.95" ry="9.75" stroke="#B4762A" stroke-width="1.5"/>
        <line x1="13" y1="3.25" x2="13" y2="22.75" stroke="#B4762A" stroke-width="1.5"/>
      </svg>
      <div><span class="nome">Grão</span><span class="sub">Painel</span></div>
    </div>
    <nav id="menu"></nav>
    <div class="rodape-lateral">
      <span id="rodapeInfo"></span>
      <button onclick="sair()">Sair</button>
    </div>
  </aside>

  <main>
    <div class="topo">
      <div>
        <h1 id="tituloSecao">Visão geral</h1>
        <p class="desc" id="descSecao"></p>
      </div>
      <div class="acoes">
        <span class="carimbo" id="carimbo"></span>
        <select id="periodo" onchange="trocarPeriodo()">
          <option value="7">7 dias</option>
          <option value="30" selected>30 dias</option>
          <option value="90">90 dias</option>
          <option value="365">1 ano</option>
        </select>
        <button class="botao" onclick="carregar()">Atualizar</button>
      </div>
    </div>
    <div class="conteudo" id="conteudo"></div>
  </main>
</div>

<script>
'use strict';

// ===========================================================================
// Estado
// ===========================================================================
var CHAVE = 'grao.admin.token';
var D = null;                 // resposta inteira de /admin/api/painel
var dias = 30;
var secaoAtual = 'visao';

// ===========================================================================
// Utilidades
// ===========================================================================
var el = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function n(v) { return Number(v || 0).toLocaleString('pt-BR'); }
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
function reais(v) {
  return 'R$ ' + Number(v || 0).toLocaleString('pt-BR',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function diaCurto(s) {
  // "2026-09-03" é dia civil, não instante: passar pelo Date faria o navegador
  // lê-lo como UTC e mostrar o dia anterior no fuso do Brasil.
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  return m ? m[3] + '/' + m[2] : '—';
}
function dataHora(s) {
  if (!s) return '—';
  return new Date(s).toLocaleString('pt-BR',
    { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function relativo(s) {
  if (!s) return 'nunca';
  var h = (Date.now() - new Date(s).getTime()) / 3600000;
  if (h < 1) return 'agora há pouco';
  if (h < 24) return Math.round(h) + 'h atrás';
  var d = Math.round(h / 24);
  return d + (d === 1 ? ' dia atrás' : ' dias atrás');
}
function vazio(texto) { return '<p class="vazio">' + esc(texto) + '</p>'; }

function cartao(titulo, nota, corpo) {
  return '<div class="cartao"><h3>' + esc(titulo) + '</h3>' +
    (nota ? '<p class="nota">' + esc(nota) + '</p>' : '') + corpo + '</div>';
}
function kpi(rotulo, valor, apoio) {
  return '<div class="cartao kpi"><p class="rotulo">' + esc(rotulo) + '</p>' +
    '<div class="valor">' + esc(valor) + '</div>' +
    '<p class="apoio">' + (apoio || '') + '</p></div>';
}

// ===========================================================================
// Gráficos — SVG à mão, sem biblioteca. A página é servida pelo nosso próprio
// backend e precisa abrir mesmo sem CDN nenhuma.
// ===========================================================================

/**
 * Escala do eixo Y: passo inteiro e "redondo", entre 3 e 6 linhas de grade.
 *
 * A conta ingênua (teto = maior valor) produz eixos como 0 · 2,25 · 4,5 · 6,75
 * · 9 — decimais para contar pessoas, que ninguém lê. Aqui o passo sai de
 * 1/2/5 × potência de dez, e o teto é o primeiro múltiplo dele acima do maior
 * valor: 9 vira 0 · 2 · 4 · 6 · 8 · 10.
 */
function escala(maior) {
  if (maior <= 4) return { teto: 4, passo: 1, linhas: 4 };
  for (var e = 0; e < 9; e++) {
    // 2,5 entra só quando o passo continua inteiro (250, 2500…): um eixo de
    // 2,5 em 2,5 pessoas não existe.
    var bases = [1, 2, 2.5, 5];
    for (var i = 0; i < bases.length; i++) {
      var passo = bases[i] * Math.pow(10, e);
      if (passo % 1) continue;
      var linhas = Math.ceil(maior / passo);
      if (linhas >= 3 && linhas <= 6) return { teto: passo * linhas, passo: passo, linhas: linhas };
    }
  }
  return { teto: maior, passo: maior / 4, linhas: 4 };
}

/** Linhas com área, uma ou mais séries, eixo Y com grade e rótulos. */
function grafico(dados, series, altura) {
  altura = altura || 240;
  var L = 780, A = altura, m = { t: 12, r: 8, b: 26, l: 38 };
  if (!dados.length) return vazio('Sem dados no período.');

  var todos = [];
  series.forEach(function (s) { dados.forEach(function (d) { todos.push(d[s.campo]); }); });
  var e = escala(Math.max.apply(null, todos.concat([0])));
  var teto = e.teto;

  var x = function (i) { return m.l + (i * (L - m.l - m.r)) / Math.max(1, dados.length - 1); };
  var y = function (v) { return m.t + (1 - v / teto) * (A - m.t - m.b); };

  var p = [];
  // grade + rótulos do eixo Y
  for (var g = 0; g <= e.linhas; g++) {
    var v = e.passo * g, yy = y(v);
    p.push('<line x1="' + m.l + '" y1="' + yy.toFixed(1) + '" x2="' + (L - m.r) +
      '" y2="' + yy.toFixed(1) + '" stroke="var(--linha-fraca)"/>');
    p.push('<text x="' + (m.l - 8) + '" y="' + (yy + 3.5).toFixed(1) +
      '" font-size="10" fill="var(--tinta-fraca)" text-anchor="end">' + n(Math.round(v)) + '</text>');
  }
  // rótulos do eixo X: no máximo 6, senão vira borrão
  var salto = Math.max(1, Math.ceil(dados.length / 6));
  dados.forEach(function (d, i) {
    if (i % salto && i !== dados.length - 1) return;
    p.push('<text x="' + x(i).toFixed(1) + '" y="' + (A - 6) +
      '" font-size="10" fill="var(--tinta-fraca)" text-anchor="middle">' + diaCurto(d.dia) + '</text>');
  });
  // séries
  series.forEach(function (s) {
    var linha = dados.map(function (d, i) {
      return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[s.campo]).toFixed(1);
    }).join(' ');
    var area = linha + ' L' + x(dados.length - 1).toFixed(1) + ' ' + y(0).toFixed(1) +
      ' L' + x(0).toFixed(1) + ' ' + y(0).toFixed(1) + ' Z';
    p.push('<path d="' + area + '" fill="' + s.cor + '" opacity=".08"/>');
    p.push('<path d="' + linha + '" fill="none" stroke="' + s.cor +
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
    // Ponto só onde há valor: um círculo em cada zero polui e não informa.
    dados.forEach(function (d, i) {
      if (!d[s.campo]) return;
      p.push('<circle cx="' + x(i).toFixed(1) + '" cy="' + y(d[s.campo]).toFixed(1) +
        '" r="3" fill="var(--carta)" stroke="' + s.cor + '" stroke-width="2">' +
        '<title>' + esc(diaCurto(d.dia) + ' · ' + s.rotulo + ': ' + n(d[s.campo])) + '</title></circle>');
    });
  });

  return '<svg class="gr" viewBox="0 0 ' + L + ' ' + A + '">' + p.join('') + '</svg>' +
    '<div class="legenda">' + series.map(function (s) {
      return '<span><i style="background:' + s.cor + '"></i>' + esc(s.rotulo) + '</span>';
    }).join('') + '</div>';
}

/** Barras horizontais com rótulo e valor. */
function barras(itens, campoRot, campoVal, opcoes) {
  opcoes = opcoes || {};
  if (!itens || !itens.length) return vazio(opcoes.vazio || 'Sem dados.');
  var max = Math.max.apply(null, itens.map(function (i) { return i[campoVal]; }).concat([1]));
  var soma = itens.reduce(function (s, i) { return s + i[campoVal]; }, 0);
  return '<div class="lista">' + itens.map(function (i) {
    var v = i[campoVal];
    return '<div class="item"><div class="cima">' +
      '<span class="rot">' + esc(i[campoRot]) + '</span>' +
      '<span class="val">' + n(v) + (opcoes.comPct ? ' · ' + pct(v, soma) + '%' : '') + '</span>' +
      '</div><div class="trilho"><i class="' + (opcoes.verde ? 'verde' : '') +
      '" style="width:' + (v / max * 100) + '%"></i></div></div>';
  }).join('') + '</div>';
}

/** Rosca com legenda ao lado. */
function rosca(itens, campoRot, campoVal) {
  if (!itens || !itens.length) return vazio('Sem dados no período.');
  var cores = ['var(--acento)', 'var(--teal)', 'var(--verde)', 'var(--barro)', 'var(--tinta-fraca)'];
  var soma = itens.reduce(function (s, i) { return s + i[campoVal]; }, 0) || 1;
  var raio = 52, grossura = 18, C = 2 * Math.PI * raio, deslocado = 0;
  var arcos = itens.map(function (i, k) {
    var frac = i[campoVal] / soma;
    var s = '<circle cx="70" cy="70" r="' + raio + '" fill="none" stroke="' + cores[k % cores.length] +
      '" stroke-width="' + grossura + '" stroke-dasharray="' + (frac * C).toFixed(2) + ' ' + C.toFixed(2) +
      '" stroke-dashoffset="' + (-deslocado * C).toFixed(2) +
      '" transform="rotate(-90 70 70)"><title>' +
      esc(i[campoRot] + ': ' + n(i[campoVal])) + '</title></circle>';
    deslocado += frac;
    return s;
  }).join('');
  return '<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">' +
    '<svg width="140" height="140" viewBox="0 0 140 140" style="flex:none">' + arcos +
    '<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="600" fill="var(--tinta)">' +
    n(soma) + '</text>' +
    '<text x="70" y="84" text-anchor="middle" font-size="10" fill="var(--tinta-fraca)">no total</text>' +
    '</svg><div class="legenda" style="flex-direction:column;gap:9px;margin:0">' +
    itens.map(function (i, k) {
      return '<span><i style="background:' + cores[k % cores.length] + '"></i>' +
        esc(i[campoRot]) + ' · <b style="font-weight:500">' + n(i[campoVal]) + '</b>' +
        ' <span class="fraco">(' + pct(i[campoVal], soma) + '%)</span></span>';
    }).join('') + '</div></div>';
}

function montarAlertas() {
  var a = [];

    a.push(['', 'Este painel está usando o token do cron.',
      'Crie um GRAO_ADMIN_TOKEN separado no Render: assim dá para trocar o acesso ao painel sem derrubar o disparo diário.']);
  }
  if (!D.planos.cobrancaAtiva && D.planos.linhas.length) {
    a.push(['', 'Ainda não existe cobrança de verdade.',
      'Nenhum gateway está ligado. O que aparece em Planos é a escolha declarada no onboarding mais o período de teste.']);
  }
  if (D.whatsapp.falhas > 0) {
    a.push(['grave', D.whatsapp.falhas + ' envio(s) falharam no período.',
      'O motivo de cada um está na seção WhatsApp.']);

  return a.map(function (x) {
    return '<div class="aviso ' + x[0] + '"><div><b>' + esc(x[1]) + '</b><p>' + esc(x[2]) + '</p></div></div>';
  }).join('');

      '<span class="fraco" style="font-weight:400">' + esc(c.nota) + '</span></td>' +
      '<td class="dir"><span class="selo ' + st.classe + '">' + st.texto + '</span></td></tr>';
  }).join('') + '</tbody></table></div>';

  var eventos = s.eventos.length
    ? '<div class="tempo">' + s.eventos.map(function (e) {
        return '<div class="ev' + (e.tipo === 'wa_send_failed' ? ' falha' : '') + '">' +
          '<span class="hora">' + esc(dataHora(e.quando)) + '</span>' +
          '<span class="quem">' + esc(e.nome) + '</span>' +
          '<span class="oque">' + esc(e.rotulo) +
          (e.detalhe ? ' <span class="fraco">· ' + esc(e.detalhe) + '</span>' : '') + '</span></div>';
      }).join('') + '</div>'
    : vazio('Nenhum evento registrado.');

  return '<div class="grade g-2-1">' +
      cartao('Configuração do servidor', 'presença, nunca o valor — um painel que mostra segredo vira vazamento', config) +
      cartao('Última entrega automática', 'a agenda varre de minuto em minuto e respeita o horário de cada pessoa', disparo) +
    '</div>' +
    '<p class="secao-titulo">Últimos acontecimentos</p><div class="cartao">' + eventos + '</div>';
}

// ===========================================================================
// Navegação e carga
// ===========================================================================
function montarMenu() {
  el('menu').innerHTML = SECOES.map(function (s) {
    var pino = '';
    if (s.id === 'whatsapp' && D && D.whatsapp.falhas > 0) {
      pino = '<span class="pino">' + D.whatsapp.falhas + '</span>';
    }
    return '<a href="#' + s.id + '" data-sec="' + s.id + '">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' + s.icone + '"/></svg>' +
      esc(s.titulo) + pino + '</a>';
  }).join('');
}

function irPara(id) {
  var s = SECOES.filter(function (x) { return x.id === id; })[0] || SECOES[0];
  secaoAtual = s.id;
  el('tituloSecao').textContent = s.titulo;
  el('descSecao').textContent = s.desc;
  el('conteudo').innerHTML = s.render();
  el('conteudo').scrollTop = 0;
  window.scrollTo(0, 0);
  Array.prototype.forEach.call(el('menu').children, function (a) {
    a.classList.toggle('ativo', a.dataset.sec === s.id);
  });
}

function desenhar() {
  el('carimbo').textContent = 'atualizado ' +
    new Date(D.geradoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  el('rodapeInfo').innerHTML = n(D.resumo.usuarios) + ' pessoas · ' +
    n(D.resumo.comWhatsapp) + ' no WhatsApp';
  montarMenu();
  irPara(secaoAtual);
}

function carregar() {
  var t = sessionStorage.getItem(CHAVE);
  if (!t) return;
  el('erro').textContent = 'carregando…';
  fetch('/admin/api/painel?dias=' + dias, { headers: { 'x-grao-token': t } })
    .then(function (r) {
      if (r.status === 401) throw new Error('Token não confere.');
      if (r.status === 503) throw new Error('Falta configurar GRAO_ADMIN_TOKEN no servidor.');
      if (!r.ok) throw new Error('Erro ' + r.status + ' ao buscar os dados.');
      return r.json();
    })
    .then(function (d) {
      D = d;
      el('erro').textContent = '';
      el('porta').classList.add('oculto');
      el('app').classList.remove('oculto');
      desenhar();
    })
    .catch(function (e) {
      el('erro').textContent = e.message;
      if (/Token/.test(e.message)) sessionStorage.removeItem(CHAVE);
    });
}

function trocarPeriodo() { dias = Number(el('periodo').value); carregar(); }
function entrar() {
  var t = el('token').value.trim();
  if (!t) return;
  sessionStorage.setItem(CHAVE, t);
  carregar();
}
function sair() { sessionStorage.removeItem(CHAVE); location.reload(); }

window.addEventListener('hashchange', function () {
  if (D) irPara(location.hash.replace('#', ''));
});
el('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });

secaoAtual = location.hash.replace('#', '') || 'visao';
if (sessionStorage.getItem(CHAVE)) carregar();
</script>
</body>
</html>
