# Deploy no Render (render.com) — "Blueprint".
# No painel: New → Blueprint → aponte para o repositório Hass1985/grao.
# As variáveis com sync:false são pedidas na tela (nunca ficam no repositório).
#
# O PLANO PRECISA SER PAGO. Não é preferência, é requisito de funcionamento.
#
# No free o serviço HIBERNA após ~15 min sem tráfego. A agenda de entrega mora
# DENTRO deste processo (setInterval de 60s em agenda.ts) e dorme junto: quem
# pediu a semente para as 7h só recebe quando alguma coisa acorda o serviço.
#
# Medido em 18/09/2026, com o serviço no free:
#   primeira chamada ao /health   23,6 s   (cold start)
#   chamadas seguintes             0,9 s
#   atraso das entregas          1 min quando acordado · 85 a 137 min quando não
#
# O padrão é bimodal justamente por isso: ou a agenda estava rodando, ou não
# estava. Nenhum ajuste de código conserta um processo que não existe.
services:
  - type: web
    name: grao-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    # --include=dev é obrigatório: com NODE_ENV=production o npm omite as
    # devDependencies, e o TypeScript (tsc) vive lá — sem ele o build quebra.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false          # cole no painel do Render
      - key: DATABASE_URL
        sync: false          # connection string do Supabase (Session pooler)
      - key: GRAO_API_TOKEN
        sync: false          # segredo dos endpoints internos (cron, orquestrador)
      - key: WA_ACCESS_TOKEN
        sync: false          # token do usuário do sistema (Meta)
      - key: WA_APP_SECRET
        sync: false          # valida a assinatura dos webhooks
      - key: WA_VERIFY_TOKEN
        sync: false          # handshake do webhook
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_BUSINESS_ACCOUNT_ID
        sync: false
      - key: GRAO_MODEL
        value: claude-opus-4-8
      - key: GRAO_OPENING_MODEL
        value: claude-opus-4-8
      - key: GRAO_BRAIN_MODEL
        value: claude-haiku-4-5-20251001
      - key: CORS_ORIGINS
        sync: false          # ex.: https://dapper-smakager-388102.netlify.app
      # Transcrição do áudio da troca de sentimento. Qualquer serviço com a
      # interface /audio/transcriptions serve (OpenAI, Groq e vários outros).
      # Sem a chave, o Grão pede o relato por escrito e nada quebra.
      - key: STT_API_KEY
        sync: false
      - key: STT_BASE_URL
        sync: false          # padrão: https://api.openai.com/v1
      - key: STT_MODEL
        sync: false          # padrão: whisper-1
