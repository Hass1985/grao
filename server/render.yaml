# Deploy no Render (render.com) — "Blueprint".
# No painel: New → Blueprint → aponte para o repositório Hass1985/grao.
# As variáveis com sync:false são pedidas na tela (nunca ficam no repositório).
#
# Plano free: 750h/mês, porém o serviço HIBERNA após ~15 min sem tráfego e a
# primeira chamada depois disso leva ~50s para responder. Ótimo para validar o
# Trial; troque para "starter" antes de abrir para usuários de verdade.
services:
  - type: web
    name: grao-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    # --include=dev é obrigatório: com NODE_ENV=production o npm omite as
    # devDependencies, e o TypeScript (tsc) vive lá — sem ele o build quebra.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false          # cole no painel do Render
      - key: DATABASE_URL
        sync: false          # connection string do Supabase (Session pooler)
      - key: GRAO_API_TOKEN
        sync: false          # segredo dos endpoints internos (cron, orquestrador)
      - key: WA_ACCESS_TOKEN
        sync: false          # token do usuário do sistema (Meta)
      - key: WA_APP_SECRET
        sync: false          # valida a assinatura dos webhooks
      - key: WA_VERIFY_TOKEN
        sync: false          # handshake do webhook
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_BUSINESS_ACCOUNT_ID
        sync: false
      - key: GRAO_MODEL
        value: claude-opus-4-8
      - key: GRAO_OPENING_MODEL
        value: claude-opus-4-8
      - key: GRAO_BRAIN_MODEL
        value: claude-haiku-4-5-20251001
      - key: CORS_ORIGINS
        sync: false          # ex.: https://dapper-smakager-388102.netlify.app
