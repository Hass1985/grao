# Deploy no Render (render.com) — "Blueprint".
# No painel: New → Blueprint → aponte para o repositório. As variáveis marcadas
# com sync:false são pedidas na tela (nunca ficam no repositório).
services:
  - type: web
    name: grao-backend
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false          # cole no painel do Render
      - key: DATABASE_URL
        sync: false          # connection string do Supabase (Session pooler)
      - key: GRAO_MODEL
        value: claude-opus-4-8
      - key: GRAO_BRAIN_MODEL
        value: claude-haiku-4-5-20251001
      - key: CORS_ORIGINS
        sync: false          # ex.: https://dapper-smakager-388102.netlify.app
